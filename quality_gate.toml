# Пороги, ниже которых CI красный. Доли от 0 до 1.
# Сначала ставим по факту первого прогона, потом поднимаем.

[accuracy]
amount = 0.90
currency = 0.90
operation = 0.90
counterparty = 0.75
invoice_number = 0.80
date = 0.80
purpose = 0.70

[limits]
valid_json_rate = 1.0          # каждый ответ разбирается по схеме
max_amount_hallucinations = 0  # сумму, которой нет в тексте, выдумывать нельзя
max_silent_errors = 1          # неверные суммы, валюты, типы операций и даты, которые не заметила проверка кодом (guards.py)
