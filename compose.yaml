services:
  # Ollama в контейнере. Включается профилем: docker compose --profile ollama ...
  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Тесты и скрипты. Без профиля ollama ходит в Ollama на хосте или работает по кассетам.
  eval:
    build: .
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      PAYEVAL_MODE: ${PAYEVAL_MODE:-replay}
      PAYEVAL_MODEL: ${MODEL:-qwen3:4b}
      PAYEVAL_JUDGE_MODEL: ${JUDGE_MODEL:-qwen3:14b}
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
        required: false

volumes:
  ollama:
